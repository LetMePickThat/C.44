pae_t_edge_s        = { value = 0.2e-6, unit = "s", status = "D", source = "DC-on time without full RF per pulse (drain switching, gate-bias / phase settling): today 0.5-2 us; 0.2 us = fast integrated switches + local buffer (2050-60); -1 % PAE on a 20 us pulse", date = "2026-10-20" }
pae_duty_slope      = { value = 0.05, unit = "-", status = "D", source = "relative PAE loss per unit duty above pae_duty_ref (channel heating), GaN-on-diamond + microchannels: -2.75 % at d = 0.65", date = "2026-10-20" }
eta_illum_tx        = { value = 1.0, unit = "-", status = "V", source = "TX illumination efficiency", date = "2026-10-20" }
