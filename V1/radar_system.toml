# --- targets (step 2.4: target library) ---------------------------------------------------------------------------
# One table per target CLASS. The values are CLASS MEANS, not the specification of one weapon (the adversary's hardware
# is unknown): a sector picks a class with its key "target_type" and may override any value (core/radar_model.py,
# target_for_sector). A class is added or changed here only, without touching the code; the loader refuses an
# incomplete class. Schema:
#   [targets.<NAME>]           v_close_mps, length_m (L), rotation_dps (omega), accel_max_mps2 (line-of-sight)
#                              optional optics_diameter_m, optics_f_ratio, optics_retro_eff (absent = no optics)
#   [targets.<NAME>.band.S]    rcs_m2 (copolar, VV along e_v, frontal: the aspect of a closing target),
#   [targets.<NAME>.band.Ku]   fluctuation ("SW0" steady | "SW1/2" many scatterers | "SW3/4" one dominant scatterer),
#                              depol_db (cross-polar / copolar RCS)
# Derived per look: T0 = coherence.t0_k x lambda / (2 L omega); fluctuation = Gamma shape k = base x min(blocks,
# 1 + T_obs / T0) x the polarisation diversity (1 + rho)^2 / (1 + rho^2) (base 1 for SW1/2, 2 for SW3/4, infinite for
# SW0); optics adds max(pi (2 f)^2, eta_r 4 pi A^2 / lambda^2) to the frontal RCS (f = f_ratio x D, A = pi D^2 / 4).
# ST is the conventional REFERENCE target (WF-LRS benchmark, self-test, CLI report), not a threat class; GENERIC
# completes a sector that names no class (tool.targets.default_type).
