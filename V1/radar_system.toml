core_hi_ghz         = { value = 2.86, unit = "GHz", status = "D", source = "upper edge of the core band, raised cosine up to usable_hi_ghz (step 1.4)", date = "2026-10-20" }
edge_derating_db    = { value = 0.5, unit = "dB", status = "D", source = "TOTAL (round-trip) loss at the usable band edges: TRM PA / LNA / filters / WAIM detuned off the core band; raised cosine between core and usable edges, AVERAGED over the occupied spectrum [f - B/2, f + B/2] (step 1.4, optimistic 2050-60; was 1.5 dB copied from the former Ku band)", date = "2026-10-20" }
