bi_max_mhz          = { value = 200.0, unit = "MHz", status = "V", source = "instantaneous bandwidth ceiling = the whole usable S band, confirmed at step 1.4: with the digital true-time delay the limit is the per-TRM converters and filters (ADC rate / data: step 4.4)", date = "2026-10-20" }
true_time_delay     = { value = "digital_per_trm", unit = "", status = "V", source = "beam steering by digital true-time delay in every TRM: no beam squint, no aperture-fill limit (step 1.4). 'none' = phase steering: the signal bandwidth is then limited to c / (D_env sin theta) (~75 MHz at 75 deg)", date = "2026-10-20" }
duty_max            = { value = 0.65, unit = "-", status = "D", source = "TRM duty ceiling on pulse trains (N > 1), hard limit in the waveform check: GaN-on-diamond + microchannels make channel heating non-limiting; 0.65 = user choice, used only when useful. ECLIPSING (receiver deaf 65 % of the time) is not modelled until 2.1: high-duty choices optimistic until then", date = "2026-10-20" }

# Fixed implementation losses, summed in this order.
[band.S.losses_db]
# (the element -> LNA path is no longer a signal loss here: its attenuation AND noise are in T_sys, [band.S.rx];
#  the PA -> element loss TX_chain is derived from [band.S.tx] and added to these posts by the model)
DSP         = { value = 2.0, unit = "dB", status = "V", source = "weighting/mismatch ~1.0 + range/Doppler straddle ~0.7 + finite precision ~0.3 (2050 deep-space)", date = "2026-10-20" }
