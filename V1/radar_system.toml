# ------------------------------------------------------------------------------------------------------- tool
[tool.cli]                    # defaults of: python core/radar_model.py
refresh_s = 120.0               # refresh of the CLI report's frame-feasibility check (WF-LRS benchmark); missions use their sector RR
frequency_ghz = 2.8
scan_angle_deg = 0.0
target = "ST"                    # a class of [targets.*] (ST = the reference target)

[tool.optimizer]              # S search waveform space and ranking (core/optimizer.py)
freq_step_mhz        = 5.0      # S centre-frequency grid, DERIVED from the band: usable_lo + k x step, the signal inside the
                                # band and outside the mission's spectrum_exclusions_ghz (step 3.1, A1-A2)
freq_coarse_mhz      = 20.0     # first pass over the valid centres on this step, + the centre-most one of every free fragment (A5-A6)
freq_fine_span_mhz   = 20.0     # second pass at freq_step_mhz within +/- this of the best coarse centre (A5)
freq_quiet_centres   = 3        # A6 (25 Oct 2026): a sector with no S exclusion and no jammer evaluates this many centres
                                # spread over the core band (optimum flat in frequency); 0 = the two-pass search always
spacing_after_frequency = true  # A5 (25 Oct 2026): frequency searched at search_grid.beam_spacing_hpbw, then every spacing
                                # of beam_spacing_options_hpbw at the frequency kept; false = every spacing at every centre
excluded_flag_frac   = 0.5      # flag a sector when the exclusions remove more than this fraction of the valid centres (A10)
tie_rel_tol          = 1e-9     # costs equal within this relative tolerance are ties, broken by the secondary criterion (E6)
tau_s                = [5e-6, 10e-6, 20e-6, 50e-6, 100e-6, 200e-6, 400e-6, 600e-6, 800e-6, 1.0e-3, 1.2e-3, 1.5e-3]
                                # + the TRM buffer limit (2.0 ms), added by the code; 5 / 10 us (2 km self-defence minimum
                                # range) and 1.0-1.5 ms added at step 3.1 (B1-B2)
n_pulses             = [1, 2, 3, 4, 6, 8, 12, 16, 24, 32]
tx_modes             = ["single", "superposition", "partition"]   # S TX modes searched (step 3.1, C); beams from
                                # [multibeam]; "tdm" is modelled but left out (exactly never better, Q1)
sig_bw_mhz           = [10.0, 20.0, 30.0, 50.0, 75.0, 100.0, 150.0, 200.0]   # 100-200 MHz added at step 3.1 (B3)
pri_min_s            = 1e-3     # PRI of single-pulse and range-ambiguous candidates
theta_bin_deg        = 1.0      # scan-angle bin of the position count
bin_deg              = 5        # 1-deg bins sharing one waveform
max_wf_per_sector    = 4        # default; sector key "max_wf_per_sector"
short_tol            = 0.01     # default; sector key "short_tol"
n_alphas             = 21       # energy weights of the scalarised energy/time cost, 0..1
short_penalty        = 1e6      # DP penalty per fraction of positions short of range
track_margin_warn    = 0.10     # warn when a face keeps less than this power fraction for tracking
sphere_res_deg       = 0.2      # (phi, eps) raster of the exact calculation
solve_cache_size     = 262144   # memoised solve() ranges per process (~50 MB when full)
solve_base_cache_size = 16384   # memoised solve_base() parts per process, ~2 KB each (step 3.2, Q6 E1; exact)
mask_cache_size      = 64       # sector masks kept per raster
parallel_min_sectors = 6        # below this, sequential run
max_workers          = 0        # 0 = automatic (half the logical CPUs)

[tool.global_opt]             # step 5.2: global optimiser (fixed point over the search plans and the budgets)
max_iterations = 3              # passes at most (the first is the independent plan of every sector; user, step 5.2)
alternatives   = 6              # plans kept per sector for the mission-level choice (same coverage and range)
auto_alloc_max = 0.0            # P4: utilisation up to which the free margin shortens the revisits (mission key, 0 = off; user, 26 Oct 2026)
reuse_corrections = 2           # P4: re-fillings after the check of the real revisits (non-linear resources)

[tool.scheduler]              # step 4.3
horizon_max_s = 60.0            # B1: synthetic timeline over the longest revisit of a face, at most this
seed          = 1               # B3: random arrivals drawn once (reproducible)

[tool.scanorder]              # step 4.3 bis: search pointings inside a volume
n_shifts     = 3                # V2: cycle of lattice shifts 0, (a+b)/3, 2(a+b)/3 (grid dithering of step 2.3)
coarse_cells = 5                # V6: coarse cells per axis of the uniformity measure
uniformity_fractions = [0.1, 0.25, 0.5]   # V6: fractions of the frame where the coverage uniformity is measured
revisit_flag_frac = 0.1         # V5: revisit of a direction off the target by more than this share is flagged

[tool.thermal]                # step 4.2
junction_check = false          # B6: waveforms whose junction exceeds tj_max_c removed (true) or only reported (false);
                                # false until the user decides on the measured impact (duty_max stays the limit)

[tool.tracking]               # track model settings (core/trackmodel.py, step 3.3)
n_ranges     = 8                # D1: ranges of a bracket over which the update cost is averaged (targets uniform in range)
floor_tau_s  = 60.0             # time constant of the process-noise floor for a non-manoeuvring class
rr_alert_iter = 14              # A8: bisection steps of the longest tenable update period
disc_n_max   = 200              # F1: most track looks counted for the discrimination
separability_n_looks = 10       # F3: looks of the class separability matrix (indicator)
gate_cells   = 100              # C5: independent cells of a Ku confirmation gate (false tracks)
false_track_flag_per_s = 1e-3   # C5: false-track rate above which the sector is flagged

[tool.confirmation]           # Ku look search space and statistics (core/tracking.py)
ku_tau_s        = [5e-6, 10e-6, 20e-6, 50e-6, 100e-6, 200e-6, 400e-6, 800e-6, 1.5e-3]   # + tau_max (2.08 ms, from
                                # the TRM buffer) added by the code (step 3.2 B1: 5 us for 2 km self-defence ranges)
ku_n_pulses     = [1, 2, 4, 8, 16, 32, 64]
ku_pri_s        = [0.5e-3, 1e-3, 2e-3, 5e-3]   # 5 ms: a 2 ms pulse needs PRI >= 3.1 ms at duty 0.65 (B3)
ku_sig_bw_mhz   = [25.0, 50.0, 100.0, 200.0]   # range accuracy, cells, migration; 200 = Ku hardware ceiling (B4)
ku_integrations = ["COHERENT", "NONCOHERENT"]  # both offered, the optimiser chooses (step 3.2 E5)
ku_cluster_tx   = ["sequential", "superposition", "partition"]   # ways of sending the 7-beam cluster (step 3.2 C1)
ku_freq_step_mhz   = 10.0       # Ku centre grid: usable_lo + k x step, signal inside the band and the exclusions (A2)
ku_freq_coarse_mhz = 50.0       # Ku centres evaluated: valid ones on this step + the centre-most of each free fragment (A5)
ku_freq_quiet_centres = 3       # A8 (25 Oct 2026): no Ku exclusion and no jammer -> this many Ku centres over the core
                                # band (Ku frequency choice flat there); 0 = the coarse grid always
margin_db_max   = 12.0          # power margins of the confirmation looks: 0 .. max dB,
margin_db_tol   = 0.05          # solved by bisection to this tolerance (step 3.2 B6; 0.01 until A9, 25 Oct 2026)
s2_touch_step_db = 0.5          # S2: grid of the S touch margin (the former grid), its Ku margin by bisection (B6)
n_snr_quantiles = 16            # quantiles of the detected-echo SNR (32 until A9, 25 Oct 2026)
gh_nodes        = 8             # Gauss-Hermite nodes of the pointing-error average (12 until A9, 25 Oct 2026)

[tool.redundancy]             # core/redundancy.py
cover_full     = 0.995          # fraction of B's scanned solid angle above which B is fully redundant
cover_min      = 0.01           # partial overlaps below this fraction are not reported
range_tol      = 0.01           # same tolerance as the optimiser's "short of range"
min_piece_deg  = 1.0            # trimmed boxes thinner than this are dropped
plan_cache_max = 256

[tool.cost_table]             # grid of core/cost_table.json (tools/gen_cost_table.py), at power.face_elec_mw
freq_ghz  = 2.8
range_km  = [100, 150, 200, 300, 500, 700, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 12000, 15000, 20000]
rcs_m2    = [0.1, 1, 10, 100, 1000, 10000]
v_mps     = [1000, 5000, 12000, 25000]
theta_deg = [0, 20, 40, 55, 65, 70, 75]

[tool.pattern]                # radiation-pattern computation (core/antenna.py)
r_max_lam_d  = 8.0              # radius evaluated around boresight, lambda / D_env (main lobe + near sidelobes)
r_step_lam_d = 0.01             # radial step of a cut
phi_step_deg = 1.5              # azimuth step between cuts (0..45 deg with the octagon symmetry)
fit_tol_db   = 0.05             # fitted RX sidelobe level within [target - tol, target]
far_step_lam_d = 0.125          # grid step of the far-sidelobe scan over the visible region (step 1.2), lambda / D_env

[tool.sky]                    # sky-noise evaluation (core/sky.py)
eval_step_hpbw  = 0.5            # T_sys evaluated every 0.5 TX beamwidth over a sector (at least the optimiser raster)
use_numba       = true           # step 3.1 (user): compiled parallel sums of the body noise when numba is installed
                                 # (same formulas in float64, ~1e-14 relative from the numpy path; false = numpy)
refine_rise_db  = 0.5            # step 3.1, P5 (D5): every raster cell is evaluated where the sky rise exceeds this,
refine_radius_hpbw = 3.0         # and within this many TX beamwidths (D6) of a stand-off jammer, of a small body's
                                 # centre and of a large body's limb (S1-S3)
refine_subsamples = 8            # step 3.1, P5 (option 3, user): every refined cell is split into 8 x 8 points (0.025
                                 # deg at the 0.2 deg raster) of equal weight, each blinded or not on its own rise and
                                 # entering the budget quantile on its own; the cell is scanned for the share left
                                 # (1 = per-cell values). A MEAN of the rise over 4 x 4 points was tried first, no gain:
                                 # one value per cell still jitters the blinding and the quantile in the hot ring
near_r_step_lam_d = 0.05         # radial step of the near-zone integral around the beam (lambda / D_env)
near_phi_step_deg = 10.0         # azimuth step of the near-zone integral
body_ring_lam_d = 2.0            # ring spacing of the body-disk sampling of the far integral (lambda / D_env)
small_body_lam_d = 2.0           # bodies of radius up to this (lambda / D_env): fine disk samples (2 x near step) only
body_rings_max  = 16            # at most this many rings (6 (2j + 1) points on ring j)
chunk           = 2048           # directions evaluated per numpy block

[tool.detection]              # detection criterion (core/detection.py, step 2.3)
offset_quantiles = 16           # quantiles of each random position loss (grid, straddle, velocity filter)
pos_law_step_db = 0.02          # position-loss laws rounded to this step (A1, 25 Oct 2026: distinct laws / 6, required SNR
                                # within 0.003 dB measured); 0 = exact
cum_snr_tol_db = 1e-3           # tolerance of the bisection inverting the cumulative criterion (A2, 25 Oct 2026; was 1e-4)
snr_cache_size = 131072         # inverted laws kept per process (~2-3 KB each); was unbounded (T3, 25 Oct 2026)
mean_curve_cache_size = 8192    # position-averaged Pd curves kept per process (16 KB each; was 32768 = 0.5 GB, T3)
position_cache_size = 32768     # position-loss laws kept per process (was unbounded, T3)
masking_offsets_cells = [1, 2, 3]   # range / Doppler offsets (resolution cells) of the masking outputs (step 2.4, D1-D2)

[tool.environment]            # structure, clutter and jamming evaluation (core/environment.py, step 2.5)
aperture_ray_rings = 3          # hexagonal rings of rays over the aperture tube (1 + 3 r (r + 1) rays: 37)
block_grid_step_uv = 0.01       # (u, v) step of the per-face blockage table
struct_noise_dirs  = 20000      # directions over the sphere for the structure far-sidelobe noise integral
clutter_ring_points = 720       # points on the iso-range ring of a surface (sidelobe clutter)
doppler_grid_points = 4096      # Doppler grid over one PRF of the clutter residual after the Doppler filter (step 3.1, P4)
clutter_velocity_samples = 11   # target velocities over the sector span where the clutter residual is evaluated; the
                                # Pd is averaged over them (step 3.1, P4 Q7 b, R1 b1)
surface_class_step_frac = 0.05  # requirement brought back to the surface (P4 Q9-Q10, R2 c2): rounded UP on this grid of
                                # the sector range (at most 1 / step classes)

[tool.targets]                # target library (step 2.4)
default_type = "GENERIC"
aspect_policy = "worst"          # step 5.1 (user): RCS of detection = the worst presentation of the class table (a class
                                 # may set its own: "frontal" = at its aspect_offset_deg, "mean" = solid-angle mean)         # class completing a sector that names no target_type (its own rcs_m2 / swerling kept)

[tool.frames]                 # frames of the volumes and navigation message (core/frames.py, step 3.0)
q_norm_tol          = 1e-3      # attitude quaternion: |q| within 1 +/- this is normalised, beyond it is refused (B3)
two_dir_min_sep_deg = 1.0       # frame 'two_dir': the two directions at least this far from aligned (R5)
sky_nav_tol_deg     = 0.5       # alert when the sky's central body differs from the navigation by more (direction, radius) (R8)
limb_alt_km         = 0.0       # frame 'limb': grazing altitude of the limb when the sector gives no limb_alt_km (R4)

[tool.alerts]                 # validation thresholds (step 1.2)
mismatch_db_per_pass = 3.0      # alert when the active-mismatch loss of a used scan direction exceeds this, per pass
sky_above_budget_db  = 1.0      # flag the positions above a sector's sky-noise budget only when the worst is this far above (step 1.5)
rr_t0_ratio          = 3.0      # flag a sector whose revisit is below this x the target T0 (looks no longer independent, step 2.4 B4)

[tool.display]
grid_res_deg = 0.5              # direction-sphere raster of the 3D views and the fast estimate
viz_freq_ghz = 2.8              # frequency of the viz-only scan limit and of the fast estimate

[tool.mission_defaults]       # values of a new mission / sector / AT bracket (operator inputs, not the radar)
eps_min_deg = -90.0             # rear limit of the scan window (-90 = no limit)
eps_max_deg = 90.0              # front limit (90 = no limit)
res_max_m   = 2.0               # range resolution requested when a sector gives none: PHYSICAL resolution since step 2.1
                                # (broadening x c / 2B: 2 m needs 89 MHz at -25 dB, above the 75 MHz search space until 3.1)
range_min_frac = 0.1            # sector range_min_km when absent = this x range_km (step 2.1, C1): blind range limit

[tool.mission_defaults.sector]
rcs_m2 = 1000.0
swerling = 1
range_km = 2000.0
rr_target_s = 30.0
v_close_min_mps = 1000.0
v_close_max_mps = 5000.0
confirm_mode = "auto"
new_targets_per_rr = 1.0
rx_sll_db = -25.0               # RX peak sidelobe level of the volume, one of aperture.rx_sll_options_db (S and Ku)
fa_per_rr = 10.0                # false alarms tolerated per sector and per revisit (detection.fa_mode 'fa_rate', step 2.3 C2)
frame = "inertial"              # frame of a new sector (core/frames.py, step 3.0 R6); a sector without the key is in the ship frame
surface_guard_km = 10.0         # a pointing that meets a surface at d < range_km must reach d - max(this, the range
                                # resolution) (step 3.1, P4 Q9: 10 km, user)

[tool.mission_defaults.box]
phi_min_deg = 0.0
phi_max_deg = 90.0
eps_min_deg = 0.0
eps_max_deg = 60.0

[tool.mission_defaults.cap]
phi0_deg = 0.0
eps0_deg = 20.0
radius_deg = 15.0

[tool.mission_defaults.bracket]
r_min_km = 0.0
r_max_km = 1000.0
n_targets = 5.0
rr_s = 2.0
angle_zone_deg = 0.2
range_acc_m = 10.0
vr_acc_mps = 5.0
