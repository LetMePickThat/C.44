# --- sky noise and isolation (step 1.5) --------------------------------------------------------------------------
# T_ant(direction) = cold sky (band.<b>.rx.t_ant_k) + galactic rise + sum over the bodies in front of the face. The
# MISSION gives the sky in the SHIP frame (global key "sky": bodies with type, direction, angular radius, optional
# T_b; optional galactic frame); later the global scenario simulator fills it (the radar model never computes where a
# body is). A body adds T_b x (A eta_rx / D_env^2) x the integral of the azimuthal-mean RX power pattern over the body
# seen in (u, v) (core/sky.py, core/antenna.py: exact main lobe, near and far sidelobes, nothing behind the ground
# plane). A position whose T_sys rises above blind_rise_db is blinded (not scanned, reported); the sector budget uses
# the (1 - short_tol) position quantile of T_sys over the other positions (optimizer short_tol, worst point up to it).
[sky]
blind_rise_db         = { value = 10.0, unit = "dB", status = "V", source = "T_sys rise above which a search / confirmation position is blinded (not scanned, reported with the body): separates the Sun in the beam (~15 dB S, ~16 dB Ku) from the Earth (~4 dB S) and the Moon (<= 2.7 dB Ku), step 1.5", date = "2026-10-21" }
