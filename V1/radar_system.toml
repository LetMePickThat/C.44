[migration]
mode        = { value = "COMPENSATED", unit = "", status = "V", source = "COMPENSATED (residual loss) | UNCOMPENSATED; velocity-bank processing cost at 2.2 / 4.4", date = "2026-10-20" }
residual_db = { value = 1.0, unit = "dB", status = "V", source = "residual loss when compensated (keystone / Radon-type processing); flat, also applied to single pulses (intra-pulse = Doppler mismatch, not migration): loss vs cells crossed at 2.2, range-Doppler coupling at 2.1", date = "2026-10-20" }

[multibeam]
l8_db = { value = 0.8, unit = "dB", status = "?", source = "TX multibeam loss at 8 beams, one law for every mode (V5.6.0, definition unknown); RX loss 0 (digital). To be replaced by per-mode models (superposition + PA back-off 1.3, aperture partition 1.1, time/frequency multiplex 2.1), mode chosen by the optimiser per context (3.1 / 5.2)", date = "2026-10-20" }
p     = { value = 1.1, unit = "-", status = "?", source = "exponent of the multibeam law L8 x (log2 B / 3)^p (0.24 / 0.51 / 0.80 dB at 2 / 4 / 8 beams); replaced with l8_db by the per-mode models", date = "2026-10-20" }

[coherence]
enable    = { value = true, unit = "", status = "D", source = "phase-noise / coherence loss (V5.4.0), coherent integration only; no known source (review 0.3)", date = "" }
