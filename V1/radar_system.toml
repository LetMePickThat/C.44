# =====================================================================================================================
# RADAR SYSTEM PARAMETERS -- single source of every value the tool uses (core/params.py loads it).
#
# Edit a value here, restart the tool: every module (model, optimiser, tracking, fast estimate, 3D view, GUI) follows.
# Derived files must then be rebuilt:  python tools/gen_cost_table.py   (core/cost_table.json, fast estimate); the
# radiation-pattern cache core/antenna_cache.json rebuilds itself (~8 s at the next start).
# The rationale of every value is in the source field and in Documentation/Choix_architecturaux.md (French).
# Another file can be used without touching this one: set the environment variable RADAR_PARAMS=<path>.
#
# Entry format (system sections):
#   name = { value = ..., unit = "...", status = "V" | "D" | "?", source = "...", date = "YYYY-MM-DD" }
#     status  V = locked by the user | D = derived / proposed, to confirm | ? = known conflict between sources, to settle
#     unit    "-" for a dimensionless number, "" for a flag or a text
#     date    date the value was locked (empty = not recorded yet)
# [tool.*] sections are the tool's own numerical settings (search grids, rasters, caches, GUI defaults), not the radar:
# they take a bare value or the same table.
#
# Sections: geometry, aperture, search_grid, detection, power, migration, multibeam, coherence, estimation,
#           band.S, band.Ku (+ losses_db, rx, tx), targets.*, confirmation, tracking, ship  |  tool.*
# =====================================================================================================================

[meta]
file_version = { value = "1.0", unit = "", status = "D", source = "step 0.1: constants moved out of the code unchanged (model V6.0.12)", date = "2026-10-20" }

# ------------------------------------------------------------------------------------------------------- system
[geometry]
face_phi_deg     = { value = [0.0, 90.0, 180.0, 270.0], unit = "deg", status = "V", source = "4 faces x 90 deg about the ship axis (Z = nose); confirmed in review 0.3", date = "2026-10-20" }
tilt_deg         = { value = 25.0, unit = "deg", status = "V", source = "all four arrays tilted toward +Z (nose), lighthouse model; was 20 deg (V6.0.12); confirmed in review 0.3", date = "2026-10-19" }
# The face sector radius is not an entry: it is derived, = the widest scan limit of the bands (scan_max_deg /
# scan_max_hi_deg of [band.*]), so the face geometry always follows the scan limits (review 0.3, 2026-10-20).

# Array build-up (review 0.3): bi-band TRSA tiles of 25 x 25 Ku TRMs and 5 x 5 S TRMs, 196 TRSAs in an approximate
# octagon. DERIVED by the code (no entries): TRSA side 260 mm, 196 TRSAs, n_trm S 4900 / Ku 122500, emissive area
# 13.2496 m2, total area with the gaps 13.2964 m2 (fill 99.65 %), envelope 4.1675 m (16 TRSAs + 15 gaps), element
# pitch S 52 mm / Ku 10.4 mm inside a TRSA (gap 0.5 mm since step 1.2, was 2 mm). The inter-TRSA gaps are a dead
# (non-radiating) region: the gain uses the emissive area.
# Radiation pattern (step 1.1): COMPUTED from this build-up by core/antenna.py (isotropic elements, near boresight, in
# lambda / D_env): TX uniform HPBW ~1.04 lambda / D_env (was 0.886 = rectangular aperture, V5.6.0); RX circular Taylor
# fitted so that the achieved peak sidelobe level is the volume's option -> eta_illum_rx and the RX beamwidth are
# derived (no entries); RMS aperture extent -> angle Cramer-Rao bound. Cached in core/antenna_cache.json.
# Scan dependence (step 1.2): gain = geometric projection cos(theta) x the active-mismatch transmission 1 - |Gamma|^2,
# ONE model for S and Ku, applied on TX and on RX (reciprocity), separate from the band-edge derating (TRMs / filters,
# step 1.4):  |Gamma|^2 = 1 - (1 - |G_waim|^2)(1 - |G_gl|^2) with
#   G_waim = (cos theta - cos theta_m) / (cos theta + cos theta_m)   current sheet matched at theta_m by a WAIM layer
#            (same magnitude in the E and H planes), theta_m = band.<b>.waim_match_deg
#   G_gl   = exp(-g / grating_lobe_g0), g = lambda / d_mean - sin theta - 1 = distance (in u) of the first grating
#            lobe to the visible region, WORST azimuth (scan along a lattice axis); d_mean = TRSA pitch / TRMs per side
#            (S 52.1 mm, Ku 10.42 mm: the gaps widen the mean pitch). With 0.5 mm gaps the margin at 2.9 GHz /
#            75 deg (outside the 70 deg limit) is 0.9 %, mismatch 1.8 dB per pass (was 4.1 dB with 2 mm gaps).
# (Removed in review 0.3: element exponent 1.1 and the V5.4.0 scan-loss law, a double count.)
[aperture]
ku_trm_pitch_m       = { value = 0.0104, unit = "m", status = "V", source = "emissive face of a Ku TRM, 10.4 x 10.4 mm", date = "2026-10-20" }
ku_trm_per_trsa_side = { value = 25, unit = "-", status = "V", source = "25 x 25 Ku TRMs (625) per TRSA", date = "2026-10-20" }
s_trm_per_trsa_side  = { value = 5, unit = "-", status = "V", source = "5 x 5 S TRMs per TRSA (52 mm pitch, ~lambda/2; only divisor of 25 near lambda/2); recalled design discussion", date = "2026-10-20" }
trsa_rows            = { value = [6, 8, 10, 12, 14, 16, 16, 16, 16, 16, 16, 14, 12, 10, 8, 6], unit = "-", status = "V", source = "TRSAs per grid row, approximate octagon, rows centred (196 TRSAs)", date = "2026-10-20" }
trsa_gap_m           = { value = 0.0005, unit = "m", status = "V", source = "clear mechanical gap between adjacent TRSAs, dead region; 2 mm -> 0.5 mm at step 1.2 (user): the 2 mm pitch break between TRSAs made gap lobes next to the grating lobe (Ku -16.6 dB) that broke the RX sidelobe options at large scan; 0.5 mm needs CTE-matched TRSA / backplane materials (thermal excursion ~0.08 mm vs ~0.6 mm Al on CFRP over 100 K, estimate)", date = "2026-10-20" }
rx_sll_options_db    = { value = [-25.0, -30.0, -35.0], unit = "dB", status = "V", source = "peak sidelobe level of the RX weighting offered to the operator PER WATCH VOLUME (mission key rx_sll_db, one setting for S and Ku; default in [tool.mission_defaults.sector]); step 1.1", date = "2026-10-20" }
rx_taper_nbar        = { value = 5, unit = "-", status = "V", source = "circular Taylor law of the RX weighting, nbar; its design level is fitted numerically so that the real octagon reaches each option (step 1.1)", date = "2026-10-20" }
rx_taper_edge        = { value = "inscribed", unit = "", status = "D", source = "radius where the Taylor law reaches its edge value: inscribed = D_env / 2 (corner elements keep the edge value; higher efficiency than circumscribed for the same achieved level, step 1.1 exploration) | circumscribed", date = "2026-10-20" }
grating_lobe_g0      = { value = 0.02, unit = "-", status = "V", source = "width (in u) of the rise of |Gamma| as the first grating lobe approaches the visible region, |G_gl| = exp(-g / g0); this term alone with the 0.5 mm gaps: 0.76 dB per pass at 2.9 GHz / 75 deg (g = 0.018; 1.8 dB with the WAIM term), 0.02 dB at 2.85 GHz / 75 deg, ~0 at 2.8 GHz; with the former 2 mm gaps 3.0 dB at 2.9 GHz / 75 deg (step 1.2)", date = "2026-10-20" }
tx_polarisation      = { value = "linear_ev", unit = "", status = "D", source = "TX polarisation: linear along e_v (face axis in the plane of the ship axis), one PA per TRM (step 1.2). No budget effect with the dual-pol RX; reference of Faraday (2.5) and polarimetry (3.3). Option to evaluate at 3.3: e_u / e_v switching per dwell (single PA + switch, ~0.1-0.2 dB)", date = "2026-10-20" }
eta_ohmic            = { value = 1.0, unit = "-", status = "V", source = "radiating-element efficiency, no feed in the digital V6 (local TX / pre-LNA paths are in TX_chain and T_sys); was 0.96 = V5.6.0 low-loss feed (sec. 5.1.7); can carry extra losses later", date = "2026-10-20" }

[search_grid]
beam_spacing_hpbw = { value = 1.04, unit = "HPBW", status = "V", source = "hexagonal TX beam lattice in TX beamwidths (real uniform-illumination pattern since step 1.1), worst-case optimum (V6.0.10): drives positions and mean TX grid loss; revisit at 2.3 (detection criterion)", date = "2026-10-20" }
rx_beam_spacing_hpbw = { value = 0.5, unit = "HPBW_RX", status = "V", source = "lattice of the digital RX beams formed in each TX position, in RX beamwidths (step 1.1, option C): residual RX grid loss 1.672 x 0.5^2 = 0.42 dB, ~3.4 RX beams per TX position at -25 dB (count -> compute load, 4.4); optimiser may tune it at 3.1 / 5.2", date = "2026-10-20" }
enable_grid_loss  = { value = true, unit = "", status = "V", source = "mean TX grid loss over the cell (V6.0.1); mean vs worst point revisited at 2.3", date = "2026-10-20" }
frame_interleaved = { value = true, unit = "", status = "D", source = "echo wait hidden by interleaving positions (digital RX); false = dwell + 2R/c; scheduler assumption, to check at 4.3", date = "" }

[detection]
pd  = { value = 0.9, unit = "-", status = "V", source = "single-look probability of detection, all sectors; cumulative Pd / per-sector value at 2.3 (5.1)", date = "2026-10-20" }
pfa = { value = 1e-8, unit = "-", status = "V", source = "per range-Doppler cell; 1e-6 until then (false-alarm confirmations cost twice the search); Shnidman fit valid down to 1e-9; real cell count at 2.2", date = "2026-10-19" }

[power]
trm_technology     = { value = "GaN-on-diamond, microchannel cooling", unit = "", status = "V", source = "V5.6.0: The TRM employs a GaN-on-diamond semiconductor architecture combined with microchannel cooling, enabling high power density and efficient heat removal suitable for sustained spaceborne operation under high peak and average load conditions", date = "2026-10-20" }
pae_duty_ref       = { value = 0.10, unit = "-", status = "D", source = "duty at which band.<b>.pae_sat is specified (usual pulsed datasheet condition); PAE = pae_sat x tau / (tau + pae_t_edge_s) x min(1, 1 - pae_duty_slope (d - pae_duty_ref)), d = tau / PRI of a train (d_ref for a single pulse); step 1.3, replaces the constant pae 0.75 shared by S and Ku", date = "2026-10-20" }
psu_eff            = { value = 0.95, unit = "-", status = "V", source = "power supply efficiency (CHAIN_EFF factor)", date = "2026-10-20" }
distribution_eff   = { value = 0.995, unit = "-", status = "V", source = "distribution efficiency (CHAIN_EFF factor)", date = "2026-10-20" }
overhead_frac      = { value = 0.03, unit = "-", status = "V", source = "overhead fraction (CHAIN_EFF = psu x distribution x (1 - overhead) = 0.917); non-TX consumption (digital RX / ADC per TRM, control, cooling) to be budgeted at 4.1 and 4.4", date = "" }
face_elec_mw       = { value = 2.0, unit = "MW", status = "V", source = "electrical power allocated per face (default of a mission)", date = "2026-10-20" }
ship_elec_total_mw = { value = 8.0, unit = "MW", status = "V", source = "ship total for the radar, distributable on demand among the faces (e.g. 3 MW on F1 and 5 MW over F2-F4); per-face allocation managed by the radar software with the other parameters at 4.1 / 5.2", date = "2026-10-20" }

[migration]
mode        = { value = "COMPENSATED", unit = "", status = "V", source = "COMPENSATED (residual loss) | UNCOMPENSATED; velocity-bank processing cost at 2.2 / 4.4", date = "2026-10-20" }
residual_db = { value = 1.0, unit = "dB", status = "V", source = "residual loss when compensated (keystone / Radon-type processing); flat, also applied to single pulses (intra-pulse = Doppler mismatch, not migration): loss vs cells crossed at 2.2, range-Doppler coupling at 2.1", date = "2026-10-20" }

[multibeam]
l8_db = { value = 0.8, unit = "dB", status = "?", source = "TX multibeam loss at 8 beams, one law for every mode (V5.6.0, definition unknown); RX loss 0 (digital). To be replaced by per-mode models (superposition + PA back-off 1.3, aperture partition 1.1, time/frequency multiplex 2.1), mode chosen by the optimiser per context (3.1 / 5.2)", date = "2026-10-20" }
p     = { value = 1.1, unit = "-", status = "?", source = "exponent of the multibeam law L8 x (log2 B / 3)^p (0.24 / 0.51 / 0.80 dB at 2 / 4 / 8 beams); replaced with l8_db by the per-mode models", date = "2026-10-20" }

[coherence]
enable    = { value = true, unit = "", status = "D", source = "phase-noise / coherence loss (V5.4.0), coherent integration only; no known source (review 0.3)", date = "" }
t0_s      = { value = 0.25, unit = "s", status = "D", source = "coherence time constant (V5.4.0); NO known source (review 0.3): LO, platform or target decorrelation undetermined", date = "" }
p         = { value = 2.0, unit = "-", status = "D", source = "exponent of the coherence term (V5.4.0); no known source (review 0.3)", date = "" }
eta_min   = { value = 0.70, unit = "-", status = "D", source = "floor of the coherence efficiency (caps the loss at 1.55 dB); reached at T = t0 (-ln eta_min)^(1/p) = 149 ms. INTERIM (review 0.3): the waveform generators drop coherent dwells longer than that, so the floor is never used; replaced at 2.2 (coherent blocks <= T_coh, noncoherent beyond)", date = "" }

[estimation]
angle_crlb_margin = { value = 1.13, unit = "-", status = "V", source = "angle accuracy = Cramer-Rao bound of the full digital aperture (ML, sigma_u = lambda / (2 pi x_rms sqrt(2 SNR)), x_rms from the build-up) x this margin, same margin as k_f / k_r; replaces k_theta 0.5 x HPBW (step 1.1, option a): independent of the RX weighting", date = "2026-10-20" }
k_f           = { value = 0.6, unit = "-", status = "V", source = "Doppler estimator constant = single-tone CRLB 0.551 x 1.13 (same margin as the angle: angle_crlb_margin); was 0.5 (V5.4.0), below the bound", date = "2026-10-20" }
range_crlb_kr = { value = 0.6, unit = "-", status = "V", source = "range estimator constant = CRLB of a rectangular spectrum (total bandwidth) 0.551 x 1.13 (same margin as the angle); was 1.3 (V5.4.0, no source); Taylor weighting derived from the real modulation at 2.1", date = "2026-10-20" }

# Since step 1.3 the face budget is ELECTRICAL: the face has face_elec_mw x psu x distribution x (1 - overhead) for
# transmission, and every look costs its RF energy / PAE(band, pulse, duty) (band.<b>.pae_*).

