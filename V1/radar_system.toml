allowed_roles       = { value = ["SEARCH", "TWS"], unit = "", status = "D", source = "S = search / TWS only: radar-software band-use policy, defined with the radar functions and scheduler (3.x / 4.3); the S2 confirmation touch is an S confirmation look outside this policy (not checked: no Waveform)", date = "2026-10-20" }
