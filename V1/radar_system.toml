p         = { value = 2.0, unit = "-", status = "D", source = "exponent of the coherence term (V5.4.0); no known source (review 0.3)", date = "" }
eta_min   = { value = 0.70, unit = "-", status = "D", source = "floor of the coherence efficiency (caps the loss at 1.55 dB); reached at T = t0 (-ln eta_min)^(1/p) = 149 ms. INTERIM (review 0.3): the waveform generators drop coherent dwells longer than that, so the floor is never used; replaced at 2.2 (coherent blocks <= T_coh, noncoherent beyond)", date = "" }

[estimation]
angle_crlb_margin = { value = 1.13, unit = "-", status = "V", source = "angle accuracy = Cramer-Rao bound of the full digital aperture (ML, sigma_u = lambda / (2 pi x_rms sqrt(2 SNR)), x_rms from the build-up) x this margin, same margin as k_f / k_r; replaces k_theta 0.5 x HPBW (step 1.1, option a): independent of the RX weighting", date = "2026-10-20" }
