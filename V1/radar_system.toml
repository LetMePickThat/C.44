# Receive chain, referred to the antenna port (same Friis formula as S), MEDIAN of each Ku range (review 0.3, Claude
# estimates to confirm): T_sys = 238.7 K (low end of the ranges ~138 K, high end ~387 K, the former block 400 K).
[band.Ku.rx]
t_ant_k            = { value = 5.0, unit = "K", status = "D", source = "antenna temperature, cold sky in Ku (CMB, negligible galactic), median of 3-8 K; direction-dependent at 1.5", date = "2026-10-20" }
t_phys_frontend_k  = { value = 320.0, unit = "K", status = "D", source = "physical temperature of the front end, same face as S, median of 290-350 K (4.2)", date = "2026-10-20" }
circulator_loss_db = { value = 0.45, unit = "dB", status = "D", source = "circulator / T-R switch at Ku, median of 0.3-0.6 dB", date = "2026-10-20" }
limiter_loss_db    = { value = 0.45, unit = "dB", status = "D", source = "LNA protection limiter at Ku (75 W TX), median of 0.3-0.6 dB", date = "2026-10-20" }
pre_lna_line_db    = { value = 0.3, unit = "dB", status = "D", source = "filter and lines before the LNA at Ku, median of 0.2-0.4 dB", date = "2026-10-20" }
lna_nf_db          = { value = 1.15, unit = "dB", status = "D", source = "Ku LNA noise figure, median of 0.8-1.5 dB", date = "2026-10-20" }
lna_gain_db        = { value = 25.0, unit = "dB", status = "D", source = "Ku LNA gain, median of 20-30 dB", date = "2026-10-20" }
post_lna_nf_db     = { value = 8.0, unit = "dB", status = "D", source = "analog chain after the LNA (down-conversion), median of 6-10 dB", date = "2026-10-20" }
post_lna_gain_db   = { value = 20.0, unit = "dB", status = "D", source = "gain of the analog chain after the LNA, median of 15-25 dB", date = "2026-10-20" }
adc_nf_db          = { value = 27.5, unit = "dB", status = "D", source = "ADC noise figure (one ADC per TRM), median of 25-30 dB", date = "2026-10-20" }
digital_noise_db   = { value = 0.05, unit = "dB", status = "D", source = "digital processing noise (finite precision), below 0.1 dB", date = "2026-10-20" }

# Transmit chain, PA output -> radiating element (TX_chain = harmonic filter + circulator (TX pass; the circulator entry
# is shared with [band.Ku.rx], one component crossed twice) + calibration coupler + line). Medians (review 0.3).
[band.Ku.tx]
harmonic_filter_db = { value = 0.2, unit = "dB", status = "V", source = "harmonic filter after the PA, median (Ku)", date = "2026-10-20" }
cal_coupler_db     = { value = 0.1, unit = "dB", status = "V", source = "calibration coupler, median (Ku)", date = "2026-10-20" }
line_to_element_db = { value = 0.2, unit = "dB", status = "V", source = "line and transition to the radiating element, median (Ku)", date = "2026-10-20" }

