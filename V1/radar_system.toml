calibration = { value = 0.5, unit = "dB", status = "V", source = "calibration residual", date = "2026-10-20" }
Ku_blockage = { value = 0.2, unit = "dB", status = "V", source = "blockage of the S aperture by the Ku array", date = "2026-10-20" }

# Receive chain, referred to the antenna port (Friis): T_sys = [T_ant + (L_pre - 1) T_phys + L_pre (T_LNA + T_post / G_LNA
# + T_ADC / (G_LNA G_post))] x 10^(digital/10), L_pre = circulator x limiter x line. "Optimised front end" locked in
# review 0.3 with the MEDIAN of each estimated range (revisit when the architecture is refined): T_sys = 154.3 K
# (the low end of the ranges would give ~95 K; the former 346.5 K was a classic T/R module, NF ~3.2 dB at the port).
[band.S.rx]
t_ant_k            = { value = 10.0, unit = "K", status = "V", source = "antenna temperature, cold sky in S (CMB + galactic), median of 5-15 K; direction-dependent at 1.5", date = "2026-10-20" }
t_phys_frontend_k  = { value = 320.0, unit = "K", status = "V", source = "physical temperature of the front end, median of 290-350 K (TRM dissipation, see 4.2)", date = "2026-10-20" }
circulator_loss_db = { value = 0.3, unit = "dB", status = "V", source = "circulator / T-R switch, median of 0.2-0.4 dB", date = "2026-10-20" }
limiter_loss_db    = { value = 0.35, unit = "dB", status = "V", source = "LNA protection limiter (TX leakage of 2 kW), median of 0.2-0.5 dB", date = "2026-10-20" }
pre_lna_line_db    = { value = 0.2, unit = "dB", status = "V", source = "filter and lines before the LNA, median of 0.1-0.3 dB", date = "2026-10-20" }
lna_nf_db          = { value = 0.75, unit = "dB", status = "V", source = "LNA noise figure, median of 0.5-1.0 dB", date = "2026-10-20" }
lna_gain_db        = { value = 27.5, unit = "dB", status = "V", source = "LNA gain, median of 25-30 dB", date = "2026-10-20" }
post_lna_nf_db     = { value = 8.0, unit = "dB", status = "V", source = "analog chain after the LNA, median of 6-10 dB", date = "2026-10-20" }
post_lna_gain_db   = { value = 20.0, unit = "dB", status = "V", source = "gain of the analog chain after the LNA, median of 15-25 dB", date = "2026-10-20" }
adc_nf_db          = { value = 27.5, unit = "dB", status = "V", source = "ADC noise figure (one ADC per TRM), median of 25-30 dB", date = "2026-10-20" }
digital_noise_db   = { value = 0.05, unit = "dB", status = "V", source = "digital processing noise (finite precision), below 0.1 dB", date = "2026-10-20" }

