# --- ship (step 2.5: structure masking, structure noise, 3D view) -------------------------------------------------
# The ship structure is the low-poly 3D model model_path (Wavefront OBJ, metres), the REFERENCE for the masking, the
# structure noise, the positions of the elements and the 3D view (user, 2026-10-22). The code places it in the SHIP
# frame (Z = ship axis, +Z = nose; z = 0 = the axial station of the four radar apertures; r = distance to the axis;
# azimuth from +X toward +Y, faces at geometry.face_phi_deg) with model_nose_axis and model_array_station_z_m, and
# checks at load time the overall dimensions below and the four apertures (centre on the panel front face of the
# model, normal at geometry.tilt_deg): a new model only needs these entries (and the material regions) updated.
