pol_loss_single_db  = { value = 3.0, unit = "dB", status = "V", source = "single-pol RX on a depolarising target; kept to study a single-pol receiver (used only if pol_rx_dual = false)", date = "2026-10-20" }
e_buf_trm_j         = { value = 25.0, unit = "J", status = "D", source = "per-TRM energy buffer (local capacitor bank feeding the pulse); was 5 J (no source). tau_max = 0.2 x 25 x 0.8 / 2000 W = 2.0 ms, wanted by the user for very long range search (blind range ~300 km is a non-event at 10000 km; the dwell time is driven by the pulse count at the long PRI); 5 cm3 at 5 J/cm3 (2050); ~270 kg of S + Ku buffers per face at 1 J/g (open point)", date = "2026-10-20" }
