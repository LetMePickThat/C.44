face_elec_mw       = { value = 2.0, unit = "MW", status = "V", source = "REFERENCE allocation per face = ship total / 4: the search optimiser weighs energy against time with it (step 4.1, A5); since step 4.1 the faces draw from the ship total in common, the mission key face_elec_mw being an optional cap per face", date = "2026-10-25" }
ship_elec_total_mw = { value = 8.0, unit = "MW", status = "V", source = "ship total for the radar, distributable on demand among the faces (e.g. 3 MW on F1 and 5 MW over F2-F4); per-face allocation managed by the radar software with the other parameters at 4.1 / 5.2", date = "2026-10-20" }

[migration]
mode        = { value = "COMPENSATED", unit = "", status = "V", source = "COMPENSATED (residual loss) | UNCOMPENSATED; velocity-bank processing cost at 2.2 / 4.4", date = "2026-10-20" }
residual_db       = { value = 0.1, unit = "dB", status = "V", source = "residual loss of the migration compensation algorithm (keystone / Radon type) when the target crosses more than 1.5 cells over the dwell (step 2.2, B5, optimistic end of 0.1-0.3 dB; was 1.0 dB lump). The velocity-bank loss is computed (bank_max_loss_db)", date = "2026-10-21" }
bank_max_loss_db  = { value = 1.0, unit = "dB", status = "V", source = "velocity-hypothesis bank: step chosen so that a target half a step off costs this much (intra-pulse law of 2.1 + walk over the dwell); the MEAN loss over the step goes to the budget, the hypotheses to the false-alarm count and the compute load (step 2.2, B2, 0.5-2 dB)", date = "2026-10-21" }

# S TX multibeam (step 3.1, block C): B beams per dwell, three modes; the digital RX already forms its beams (RX loss 0,
# compute load at 4.4). Superposition: every TRM sends the phase-only sum of the B beams (constant envelope, PAs
# saturated, PAE unchanged), P / B per beam, full TX gain. Partition: the face is cut into B sub-apertures (B = 2:
# halves, cut horizontal 'h' or vertical 'v'; B = 4: quadrants), P / B and G x N_sub / N per beam, TX beam of the
# sub-aperture (computed pattern, core/antenna.py) on its own lattice: fewer positions. Time multiplex: B full-power
# pulses back to back per PRI (blind range c B tau / 2, buffer B tau, duty B tau / PRI); modelled, not offered to the
# optimiser (same energy and time per position as one beam, never better: exact). Linear superposition and frequency
# multiplex left out (block C). Replaces l8_db / p (V5.6.0 law of unknown definition).
[multibeam]
superposition_beams   = { value = [2, 4, 8], unit = "-", status = "V", source = "beams of the phase-only superposition (step 3.1, C)", date = "2026-10-23" }
superposition_loss_db = { value = [0.4, 0.6, 0.8], unit = "dB", status = "V", source = "TX loss of the phase-only superposition at 2 / 4 / 8 beams (power lost to the intermodulation of the constant-envelope sum), step 3.1, C", date = "2026-10-23" }
partition_beams       = { value = [2, 4], unit = "-", status = "V", source = "aperture partition: 2 halves (cut 'h' or 'v', both evaluated, Q3) or 4 quadrants; grid of positions on the widened sub-aperture beam (Q2 b), step 3.1, C", date = "2026-10-23" }
tdm_beams             = { value = [2, 4, 8], unit = "-", status = "V", source = "time multiplex, no loss: B full-power pulses back to back per PRI; blind range c B tau / 2, buffer and duty with B tau (Q1, step 3.1, C); not in the optimiser's space (never better than one beam in the TX-time budget)", date = "2026-10-23" }

[coherence]
enable               = { value = true, unit = "", status = "D", source = "coherence loss of the coherent blocks (target + oscillator + platform), step 2.2", date = "2026-10-21" }
t0_k                 = { value = 1.0, unit = "-", status = "V", source = "target coherence time T0 = t0_k x lambda / (2 L omega), L and omega of the target class (step 2.4, B1; replaces the provisional t0_s 0.25 s of step 2.2); eta = exp(-(T / T0)^p) per coherent block", date = "2026-10-22" }
p                    = { value = 2.0, unit = "-", status = "V", source = "exponent of the target coherence law: Gaussian Doppler spectrum of a rotating target (step 2.4, B2)", date = "2026-10-22" }
# Oscillator (step 2.2, A1-A3): one LO for TX and RX, its phase noise filtered by the round trip 4 sin^2(pi f tau_rt);
# residual phase variance from 1 / T_block to B / 2 -> loss 4.34 sigma^2 (negligible with these values), Doppler floor
# output. Platform: residual structure / platform motion after compensation, phase 4 pi delta / lambda.
lo_ref_ghz           = { value = 10.0, unit = "GHz", status = "V", source = "carrier of the LO phase-noise table below; scaled to the carrier by +20 log(f / ref)", date = "2026-10-21" }
lo_offsets_hz        = { value = [1.0, 10.0, 100.0, 1e3, 1e4, 1e5, 1e6], unit = "Hz", status = "V", source = "offsets of the LO phase-noise table (log-log interpolation, flat beyond the ends)", date = "2026-10-21" }
lo_ssb_dbc_hz        = { value = [-100.0, -120.0, -140.0, -150.0, -160.0, -170.0, -175.0], unit = "dBc/Hz", status = "V", source = "LO single-sideband phase noise at lo_ref_ghz, optimistic end (photonic, optical frequency division); a realistic space LO today: -60 / -90 / -110 / -130 / -140 / -150 / -155 dBc/Hz (step 2.2, A1)", date = "2026-10-21" }
platform_motion_rms_m= { value = 1e-05, unit = "m", status = "V", source = "residual platform / structure motion over a coherent block after compensation, rms (step 2.2, A5, optimistic end of 10-100 um): phase 4 pi delta / lambda", date = "2026-10-21" }

[estimation]
angle_crlb_margin = { value = 1.13, unit = "-", status = "V", source = "angle accuracy = Cramer-Rao bound of the full digital aperture (ML, sigma_u = lambda / (2 pi x_rms sqrt(2 SNR)), x_rms from the build-up) x this margin, same margin as k_f / k_r; replaces k_theta 0.5 x HPBW (step 1.1, option a): independent of the RX weighting", date = "2026-10-20" }
k_f           = { value = 0.6, unit = "-", status = "V", source = "Doppler estimator constant = single-tone CRLB 0.551 x 1.13 (same margin as the angle: angle_crlb_margin); was 0.5 (V5.4.0), below the bound", date = "2026-10-20" }
range_crlb_kr = { value = 0.6, unit = "-", status = "V", source = "range estimator constant = CRLB of a rectangular spectrum (total bandwidth) 0.551 x 1.13 (same margin as the angle); was 1.3 (V5.4.0, no source); Taylor weighting derived from the real modulation at 2.1", date = "2026-10-20" }

# Since step 1.3 the face budget is ELECTRICAL: the face has face_elec_mw x psu x distribution x (1 - overhead) for
# transmission, and every look costs its RF energy / PAE(band, pulse, duty) (band.<b>.pae_*).

# --- waveforms ----------------------------------------------------------------------------------------------------
# Pulse modulation and compression, intra-pulse effects, dwell timeline (step 2.1; optimistic end of every range, user).
# Family chosen per look: NLFM when f_d,max / B <= nlfm_doppler_max_frac (f_d,max = 2 v_close / lambda), else LFM with
# a Taylor receive weighting. Range sidelobes = the volume's RX sidelobe option (rx_sll_db). Derived (no entries):
# weighting loss and main-lobe broadening (1D Taylor), k_r = range_crlb_kr / RMS-bandwidth ratio, LFM Doppler loss
# -20 log(1 - f_d / B), range-Doppler coupling c f_d tau / 2B (corrected by the Doppler measurement, output), cells
# crossed in the pulse n_c = 2 v tau B / c and the velocity-mismatch loss (bank of 2.2), blind range
# c (tau + limiter recovery) / 2, eclipsing of ambiguous (staggered) trains.
[waveform]
modulations           = { value = ["lfm", "nlfm"], unit = "", status = "V", source = "modulation families modelled (step 2.1, A1): LFM (Doppler tolerant) and NLFM (low range sidelobes by the frequency law, no weighting loss); phase codes left out (Doppler intolerant at 25 km/s)", date = "2026-10-21" }
nlfm_doppler_max_frac = { value = 0.02, unit = "-", status = "V", source = "NLFM used while f_d,max / B stays below this (A3, optimistic end of 1-5 %): at 25 km/s only above ~23 MHz in S, ~117 MHz in Ku; LFM beyond", date = "2026-10-21" }
nlfm_mismatch_loss_db = { value = 0.1, unit = "dB", status = "V", source = "NLFM mismatch loss (A6, optimistic end of 0.1-0.3 dB); same main-lobe broadening and RMS bandwidth as the weighted LFM of the same sidelobe level", date = "2026-10-21" }
