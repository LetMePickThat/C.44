adc_w              = { value = 0.1, unit = "W", status = "V", source = "one ADC (250 Msps, 13 bits), two per TRM (polarisations), always on (step 4.1, B1; optimistic end, today 0.3-1 W); replaces overhead_frac 3 %", date = "2026-10-25" }
dbf_kw             = { value = 50.0, unit = "kW", status = "V", source = "CEILING of the digital beamforming and processing power per face (step 4.4, C4; was the always-on consumption of step 4.1, B3): it sets the processing capacity (core/compute.py) and stays the always-on figure of the power and heat budgets that size the plan (conservative); the consumption computed by step 4.4 is reported beside them", date = "2026-10-25" }
control_kw         = { value = 2.0, unit = "kW", status = "V", source = "control and housekeeping per face (step 4.1, B4)", date = "2026-10-25" }
pump_frac          = { value = 0.02, unit = "-", status = "V", source = "cooling pumps: this fraction of the face's mean dissipated heat (step 4.1, B5; step 4.2)", date = "2026-10-25" }
face_feeder_max_mw = { value = 8.0, unit = "MW", status = "V", source = "mean power one face's feeder / converter / distribution can carry (step 4.1, A): a face may draw up to the whole ship budget when the others are idle", date = "2026-10-25" }
face_store_mj      = { value = 5.0, unit = "MJ", status = "V", source = "energy storage per face, shared by S and Ku (step 4.1, D1: supercapacitors ~30 Wh/kg in 2050, ~46 kg)", date = "2026-10-25" }
face_store_max_mw  = { value = 15.0, unit = "MW", status = "V", source = "largest discharge power of the face storage (step 4.1, D2: covers the S peak ~12 MW or the Ku peak ~14 MW)", date = "2026-10-25" }
